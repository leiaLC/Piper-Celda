# Pose de la base del brazo sobre la placa estabilizadora.
#
# UNICA FUENTE DE VERDAD. La leen tanto celda_piper.launch.py (Gazebo) como
# moveit.launch.py (planificador). Antes estaba duplicada entre el launch y
# los defaults del xacro, y bastaba cambiar uno para que Gazebo y MoveIt
# discreparan sin avisar: el brazo aparecia girado en una ventana y no en la
# otra, y los planes eran invalidos sin que nada diera error.
#
# Cambia el valor AQUI y los dos lo toman.

x: 0.0
y: 0.135
z: 0.754
yaw: 1.5708      # +90 grados. Antes -1.5708.

# y: 0.14 -> 0.135 en la rev. 3 del mundo. El circulo del plano CAD marca el
# centro de la base a 36.5 cm del borde frontal, o sea y = 0.135. Son 5 mm y
# no cambian nada funcional, pero la placa del mundo es ahora el disco de
# 150 mm del plano y conviene que el brazo caiga en su centro.
# Si algo taras contra la posicion vieja, revierte AQUI y en ningun otro sitio.

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    brazo_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    pinza_controller:
      type: joint_trajectory_controller/JointTrajectoryController

brazo_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    # Tolerancias holgadas: con mallas de colision el contacto mete ruido y
    # tolerancias estrictas hacen que MoveIt aborte trayectorias validas.
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      joint1: {trajectory: 0.5, goal: 0.05}
      joint2: {trajectory: 0.5, goal: 0.05}
      joint3: {trajectory: 0.5, goal: 0.05}
      joint4: {trajectory: 0.5, goal: 0.05}
      joint5: {trajectory: 0.5, goal: 0.05}
      joint6: {trajectory: 0.5, goal: 0.05}

pinza_controller:
  ros__parameters:
    joints:
      - joint7
      - joint8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    # Tolerancias holgadas a proposito. La pinza trabaja en contacto: al
    # cerrar sobre la laminilla el dedo se queda corto respecto del comando,
    # y eso NO es un fallo. Con trajectory=0.02 el controlador abortaba con
    # "Aborted due to path tolerance violation" antes de terminar de abrir.
    constraints:
      stopped_velocity_tolerance: 0.10
      goal_time: 5.0
      joint7: {trajectory: 0.20, goal: 0.05}
      joint8: {trajectory: 0.20, goal: 0.05}
